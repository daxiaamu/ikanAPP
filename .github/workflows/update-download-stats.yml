name: Update download statistics

on:
  workflow_dispatch:
  release:
    types: [published, released, edited, deleted]
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: download-statistics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/github-script@v7
        env:
          STATS_FILE: download-stats.json
        with:
          script: |
            const fs = require("fs");
            const path = process.env.STATS_FILE;
            const previous = fs.existsSync(path)
              ? JSON.parse(fs.readFileSync(path, "utf8"))
              : {};
            const archived = { ...(previous.archivedDownloadsByRelease || {}) };
            const previousAssets = previous.trackedAssets || [];

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const published = releases.filter((release) => !release.draft);
            const currentAssets = published
              .flatMap((release) =>
                release.assets
                  .filter((asset) => asset.name.toLowerCase().endsWith(".apk"))
                  .map((asset) => ({
                    id: String(asset.id),
                    tag: release.tag_name,
                    name: asset.name,
                    downloadCount: asset.download_count,
                  })),
              )
              .sort((a, b) => a.tag.localeCompare(b.tag) || a.name.localeCompare(b.name));
            const currentIds = new Set(currentAssets.map((asset) => asset.id));

            for (const asset of previousAssets) {
              if (!currentIds.has(String(asset.id))) {
                archived[asset.tag] =
                  (archived[asset.tag] || 0) + (asset.downloadCount || 0);
              }
            }

            const releaseNames = new Map(
              published.map((release) => [release.tag_name, release.name || release.tag_name]),
            );
            const tags = new Set([
              ...Object.keys(archived),
              ...currentAssets.map((asset) => asset.tag),
            ]);
            const perRelease = [...tags]
              .map((tag) => ({
                tag,
                name: releaseNames.get(tag) || tag,
                downloads:
                  (archived[tag] || 0) +
                  currentAssets
                    .filter((asset) => asset.tag === tag)
                    .reduce((sum, asset) => sum + asset.downloadCount, 0),
              }))
              .sort((a, b) => b.tag.localeCompare(a.tag, undefined, { numeric: true }));
            const totalDownloads = perRelease.reduce(
              (sum, release) => sum + release.downloads,
              0,
            );
            const next = {
              totalDownloads,
              releases: perRelease,
              archivedDownloadsByRelease: archived,
              trackedAssets: currentAssets,
            };

            fs.writeFileSync(path, `${JSON.stringify(next, null, 2)}\n`);

      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download-stats.json
          git diff --cached --quiet || git commit -m "Update download statistics"
          git push origin HEAD:main
