    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#00110F" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="36" fill="url(#background)"/>
  <circle cx="1060" cy="70" r="240" fill="url(#glow)"/>
